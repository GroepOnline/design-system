name: UI showcase (reusable)

on:
  workflow_call:

# Read-only. Never checkout/execute PR code.
permissions:
  contents: read
  pull-requests: read

jobs:
  visual-evidence:
    name: UI showcase evidence
    runs-on: chefgroep-ci-oci
    timeout-minutes: 5
    steps:
      - name: Verify PR visual evidence
        uses: actions/github-script@f28eb0e427b963cf55da1b062df8c78e596b8340 # v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr = context.payload.pull_request;
            if (!pr) {
              core.setFailed('UI showcase gate requires a pull_request event in the caller.');
              return;
            }
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: pr.number, per_page: 100,
            });
            if (files.length >= 3000) {
              core.setFailed('File list reached the GitHub 3000-file limit; manual review required.');
              return;
            }

            const isUiFile = (path) => {
              const p = path.replace(/\\/g, '/').toLowerCase();
              if (/(^|\/)(test|tests|__tests__|fixtures|vendor|node_modules|dist|build|coverage|snapshots)(\/|$)/.test(p)) return false;
              if (/(^|\/)(screenshots?|visual-evidence|visual-showcase)(\/|$)/.test(p)) return false;
              if (/^(docs?|\.github)\//.test(p)) return false;
              if (/\.(css|scss|sass|less|html?|vue|svelte|astro|jsx|tsx|xib|storyboard|svg)$/.test(p)) return true;
              if (/(^|\/)(ui|gui|frontend|client|web|pages|components|screens|views|widgets|themes|icons|logos|branding|images)(\/|$)/.test(p) && /\.(js|ts|svg|png|jpe?g|webp|avif|gif|swift|kt|dart|xml|qml)$/.test(p)) return true;
              if (/(^|\/)(public|assets|static)\/(.*\/)?[^/]+\.(svg|png|jpe?g|webp|avif|gif)$/.test(p)) return true;
              return false;
            };
            const uiFiles = files.filter(f => isUiFile(f.filename));
            if (!uiFiles.length) {
              core.info('No user-visible UI files changed. No screenshot required.');
              return;
            }
            const body = pr.body || '';
            const heading = /^##\s+(?:UI|Visual) showcase\s*$/im.exec(body);
            if (!heading) {
              core.setFailed('UI changed, but the PR is missing a "## UI showcase" section with at least one embedded screenshot.');
              return;
            }
            const afterHeading = body.slice(heading.index + heading[0].length);
            const section = afterHeading.split(/^##\s+/m)[0];
            const urls = [];
            for (const match of section.matchAll(/!\[[^\]\n]+\]\(\s*<?([^\s)>]+)>?(?:\s+"[^"]*")?\s*\)/g)) urls.push(match[1]);
            for (const match of section.matchAll(/<img\b[^>]*\bsrc=["']([^"']+)["'][^>]*>/gi)) urls.push(match[1]);
            const changedImages = new Set(files.filter(f => /\.(png|jpe?g|webp|avif|gif)$/i.test(f.filename)).map(f => f.filename));
            const validLocation = (url) => {
              const clean = url.split(/[?#]/)[0];
              if (/^https:\/\/(?:github\.com\/user-attachments\/assets\/|user-images\.githubusercontent\.com\/|private-user-images\.githubusercontent\.com\/)/i.test(url)) return true;
              if (/^https:\/\/[a-z0-9.-]+\/[a-z0-9_./%+-]+\.(png|jpe?g|webp|avif|gif)$/i.test(clean)) return true;
              const local = decodeURIComponent(clean.replace(/^\.\//, '').replace(/^\//, ''));
              return !/^https?:/i.test(local) && changedImages.has(local);
            };
            const screenshots = urls.filter(validLocation);
            if (!screenshots.length) {
              core.setFailed('UI changed, but the showcase has no embedded screenshot. Gallery HTML, checkboxes and unrendered SVGs do not count.');
              return;
            }
            core.info('UI showcase: ' + uiFiles.length + ' UI files, ' + screenshots.length + ' screenshot(s).');
            await core.summary.addHeading('UI showcase evidence', 3)
              .addRaw(uiFiles.length + ' UI file(s) changed; ' + screenshots.length + ' screenshot(s) embedded.')
              .write();
