        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          venv="${RUNNER_TEMP:-/tmp}/cf-ci-venv-infra"
          rm -rf "$venv"
          python3 -m venv "$venv"
          "$venv/bin/python" -m pip install -q -r requirements-dev.txt
          echo "$venv/bin" >> "$GITHUB_PATH"
      - name: Infra CI (catalog entrypoint)
        if: steps.gate.outputs.run == 'true'
        run: python3 scripts/run_subtree_ci.py --lane infra
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.gate.outputs.run == 'true'
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-${{ runner.arch }}-pip-python-${{ env.PYTHON_VERSION }}-${{ hashFiles('requirements-dev.txt') }}-infra

  docs_graphs:
    name: docs-graphs-indexes
    needs: [pr_trust_gate, affected]
    if: >-
      needs.pr_trust_gate.result == 'success' &&
      needs.affected.result == 'success' &&
      needs.pr_trust_gate.outputs.trusted == 'true' &&
      (
        needs.affected.outputs.docs_graphs_indexes == 'true' ||
        needs.affected.outputs.full_suite == 'true'
      )
    runs-on: ${{ github.event_name == 'pull_request' && fromJSON('["self-hosted","Linux","X64","pr-isolated","cf"]') || fromJSON('["self-hosted","Linux","X64","heavy","cf"]') }}
    timeout-minutes: 10
    steps:
      - name: Applicability
        id: gate
        env:
          # Planner reason embeds diff paths: never interpolate it into the script body.
          REASON: ${{ needs.affected.outputs.reason }}
        run: |
          # Symmetry with the catalog guard: check the job result, not only the
          # output. A failed/cancelled pr-trust-gate skips this job today, but an
          # empty `trusted` output must never read as "not applicable, success".
          if [[ "${{ needs.pr_trust_gate.result }}" != "success" ]]; then
            echo "::error::pr-trust-gate result is '${{ needs.pr_trust_gate.result }}' (need success); lane fails closed"
            exit 1
          fi
          if [[ "${{ needs.pr_trust_gate.outputs.trusted }}" != "true" ]]; then
            echo "::notice::not-applicable: cross-repo PR blocked before checkout (GRO-1209)"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          want="${{ needs.affected.outputs.docs_graphs_indexes }}"
          full="${{ needs.affected.outputs.full_suite }}"
          printf 'want=%s full_suite=%s reason=%s\n' "$want" "$full" "$REASON"
          if [[ -z "$want" && -z "$full" ]]; then
            echo "::warning::planner produced no lane outputs; failing open to run this lane"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$full" != "true" && "$want" != "true" ]]; then
            echo "::notice::not-applicable: docs/graphs/indexes paths unchanged"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: steps.gate.outputs.run == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        if: github.event_name == 'pull_request' && steps.gate.outputs.run == 'true'
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-${{ runner.arch }}-pip-python-${{ env.PYTHON_VERSION }}-${{ hashFiles('requirements-dev.txt') }}-docs
      # Per-job venv under RUNNER_TEMP (see the planner job): no shared
      # site-packages writes on the persistent runner.
      - name: Graph/index/RAG freshness
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          venv="${RUNNER_TEMP:-/tmp}/cf-ci-venv-docs"
          rm -rf "$venv"
          python3 -m venv "$venv"
          "$venv/bin/python" -m pip install -q -r requirements-dev.txt
          "$venv/bin/python" scripts/validate_graphs_indexes.py
          "$venv/bin/python" scripts/validate_ci_lanes.py
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.gate.outputs.run == 'true'
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-${{ runner.arch }}-pip-python-${{ env.PYTHON_VERSION }}-${{ hashFiles('requirements-dev.txt') }}-docs

  merge_gate:
    name: merge-gate
    # Cheap aggregator; keep on pr-isolated for PRs, heavy for push-main.
    runs-on: ${{ github.event_name == 'pull_request' && fromJSON('["self-hosted","Linux","X64","pr-isolated","cf"]') || fromJSON('["self-hosted","Linux","X64","heavy","cf"]') }}
    timeout-minutes: 5
    needs: [pr_trust_gate, affected, cold_checkout, catalog, control_python, chefapp_rust, node_web_vault, infra_contracts, docs_graphs]
    # always(), NOT !cancelled(): a skipped required check satisfies branch
    # protection, so the merge authority must still report red when the run is
    # cancelled. The catalog job can use !cancelled() because its own guard step
    # fails closed; the aggregator has no such fallback. Cost of a cancelled,
    # superseded head is one short aggregator job on a stale SHA.
    if: always()
    steps:
      - name: Reject untrusted PR (no checkout)
        run: |
          if [[ "${{ needs.pr_trust_gate.result }}" != "success" ]]; then
            echo "::error::pr-trust-gate did not succeed; merge gate fails closed"
            exit 1
          fi
          if [[ "${{ needs.pr_trust_gate.outputs.trusted }}" != "true" ]]; then
            echo "::error::cross-repo PR blocked before any repo checkout (GRO-1209)"
            exit 1
          fi
      # actions/checkout@v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: needs.pr_trust_gate.outputs.trusted == 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      # actions/setup-python@v7.0.0 — the merge authority must not depend on
      # whatever python3 happens to exist on the persistent self-hosted runner.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        if: needs.pr_trust_gate.outputs.trusted == 'true'
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Aggregate required lanes
        if: needs.pr_trust_gate.outputs.trusted == 'true'
        env:
          # Env indirection for PR-controlled identity, same rule as pr-trust-gate:
          # expression substitution happens before the shell parses the script.
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          python3 scripts/merge_gate_aggregate.py \
            --trusted "${{ needs.pr_trust_gate.outputs.trusted }}" \
            --pr-trust-gate "${{ needs.pr_trust_gate.result }}" \
            --cold-checkout "${{ needs.cold_checkout.result }}" \
            --affected "${{ needs.affected.result }}" \
            --catalog "${{ needs.catalog.result }}" \
            --control-python "${{ needs.control_python.result }}" \
            --chefapp-rust "${{ needs.chefapp_rust.result }}" \
            --node-web-vault "${{ needs.node_web_vault.result }}" \
            --infra-contracts "${{ needs.infra_contracts.result }}" \
            --docs-graphs-indexes "${{ needs.docs_graphs.result }}" \
            --allow-unselected-skip \
            --full-suite "${{ needs.affected.outputs.full_suite }}" \
            --select-control "${{ needs.affected.outputs.control }}" \
            --select-chefapp "${{ needs.affected.outputs.chefapp }}" \
            --select-vault "${{ needs.affected.outputs.vault }}" \
            --select-infra "${{ needs.affected.outputs.infra }}" \
            --select-docs "${{ needs.affected.outputs.docs_graphs_indexes }}" \
            --removed-control "${{ needs.affected.outputs.control_removed }}" \
            --removed-chefapp "${{ needs.affected.outputs.chefapp_removed }}" \
            --removed-vault "${{ needs.affected.outputs.vault_removed }}" \
            --removed-infra "${{ needs.affected.outputs.infra_removed }}" \
            --event-name "$EVENT_NAME" \
            --head-repo "$HEAD_REPO" \
            --base-repo "$BASE_REPO"
