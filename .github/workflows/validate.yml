name: validate
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 ds build --check
        name: "ds build (idempotent — failt als gegenereerde bestanden verouderd zijn)"
      - run: python3 ds check
        name: "ds check (catalogus, sprites, em-dash, brain wikilinks)"
