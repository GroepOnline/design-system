name: validate
on: [push, pull_request]

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # GitHub-hosted runners banned until Actions spending restored (fleet only).
    runs-on: ${{ github.event_name == 'pull_request' && fromJSON('["self-hosted","Linux","X64","pr-isolated"]') || fromJSON('["self-hosted","Linux","X64","heavy"]') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v7
        with: { node-version: "20" }
      - run: python -m pip install ruff
        name: "Installeer Ruff voor Python"
      - run: npm install --global markdownlint-cli
        name: "Installeer markdownlint voor Markdown"
      - run: ./scripts/lint.sh
        name: "Lint per bestandstype"
      - run: python3 ds build --check
        name: "ds build --check (failt als gegenereerde output drift vertoont)"
      - run: python3 ds check
        name: "ds check (catalogus, sprites, em-dash, brain wikilinks)"
      - run: python3 ds brain gate
        name: "ds brain gate (signals + scorecard)"
