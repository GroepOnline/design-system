name: validate
on: [push, pull_request]

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v7
        with: { node-version: "20" }
      - run: python -m pip install ruff
        name: "Installeer Ruff voor Python"
      - run: npm install --global markdownlint-cli
        name: "Installeer markdownlint voor Markdown"
      - run: ./scripts/lint.sh
        name: "Lint per bestandstype"
      - run: python3 ds build --check
        name: "ds build --check (failt als gegenereerde output drift vertoont)"
      - run: python3 ds check
        name: "ds check (catalogus, sprites, em-dash, brain wikilinks)"
      - run: python3 scripts/a11y-audit.py && python3 scripts/validate-quality-contract.py && python3 scripts/design-standard-check.py
        name: "accessibility + quality contract + ChefGroep design standard"
      - run: python3 scripts/verify-runtime-packages.py
        name: "runtime package contract + npm pack dry-run"
      - run: python3 scripts/build-release-bundle.py && python3 scripts/smoke-runtime-bundle.py
        name: "packed runtime consumer smoke"
      - run: python3 ds brain gate
        name: "ds brain gate (signals + scorecard)"
