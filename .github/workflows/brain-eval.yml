name: brain-eval

on:
  schedule:
    # 04:12 UTC — offset from kater agent-taste-eval (04:27)
    - cron: "12 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: brain-eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    # GitHub-hosted runners banned until Actions spending restored (fleet only).
    runs-on: ${{ github.event_name == 'pull_request' && fromJSON('["self-hosted","Linux","X64","pr-isolated"]') || fromJSON('["self-hosted","Linux","X64","heavy"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }

      - name: ds brain eval (write scorecard)
        run: |
          EXTRA=""
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            EXTRA="--enforce-freshness"
          fi
          python3 ds brain eval $EXTRA
        id: eval

      - name: ds brain gate
        run: |
          EXTRA=""
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            EXTRA="--enforce-freshness"
          fi
          python3 ds brain gate $EXTRA

      - name: Upload scorecard artefact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: brain-scorecard
          path: |
            brain/eval/scorecard.json
            brain/signals/signals.yaml
          retention-days: 30

      - name: Open issue on gate failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'brain-eval gate failed (nightly)';
            const body = [
              'Scheduled `ds brain gate --enforce-freshness` failed.',
              '',
              'Artefact: `brain-scorecard` on this workflow run.',
              'No auto-commit; fix locally with `./ds brain eval` / signals, then push.',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'brain-eval',
              per_page: 5,
            });
            if (issues.data.some(i => i.title === title)) {
              console.log('issue already open');
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['brain-eval'],
            });
