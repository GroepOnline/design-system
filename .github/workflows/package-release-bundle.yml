name: Package release bundle
on:
  workflow_dispatch:
  push:
    tags: ["signaal-v*"]
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "20" }
      - name: Build runtime package bundle
        run: python3 scripts/build-release-bundle.py
      - name: Smoke actual tarballs
        run: python3 scripts/smoke-runtime-bundle.py
      - name: Upload release bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signaal-runtime-${{ github.sha }}
          path: dist/runtime-packages/
          retention-days: 7
