name: Consumer contract
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    # GitHub-hosted runners banned until Actions spending restored (fleet only).
    runs-on: ${{ github.event_name == 'pull_request' && fromJSON('["self-hosted","Linux","X64","pr-isolated"]') || fromJSON('["self-hosted","Linux","X64","heavy"]') }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate contract example
        run: python3 scripts/validate-consumer-contract.py contracts/consumer-contract.example.json
