<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{NAAM}}</title>
<link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<style>
  body { min-height: 100vh; display: flex; flex-direction: column; }
  .topbar {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 18px; border-bottom: 1px solid var(--line);
  }
  .ws-logo {
    width: 20px; height: 20px; border-radius: 6px;
    background: var(--text); color: var(--bg);
    display: grid; place-items: center; font-size: 11px; font-weight: 600;
  }
  .topbar .name { font-weight: 500; font-size: 14px; }
  .topbar .right { margin-left: auto; }
  main { flex: 1; display: grid; place-items: center; padding: 40px 24px; }
  .empty { text-align: center; max-width: 380px; }
  .empty h1 { font-size: 22px; font-weight: 500; letter-spacing: -0.02em; margin-bottom: 8px; }
  .empty p { color: var(--text-muted); font-size: 14px; margin-bottom: 20px; }
</style>
</head>
<body>
<div class="topbar">
  <div class="ws-logo">{{INITIALE}}</div>
  <span class="name">{{NAAM}}</span>
  <div class="right">
    <button class="gbtn" id="themeBtn" title="Thema wisselen">
      <svg class="ic"><use href="components/icons.svg#i-moon"/></svg>
    </button>
  </div>
</div>
<main>
  <div class="empty">
    <h1>{{NAAM}}</h1>
    <p>Gescaffold vanuit design-system v2. Bouw surfaces met componenten uit
    <span class="mono" style="font-size:12.5px">components/</span> — zie DESIGN-PTR.md.</p>
    <button class="btn primary">Eerste actie</button>
  </div>
</main>
<script src="components/lib.js"></script>
<script>
  document.getElementById("themeBtn").addEventListener("click", () => {
    const el = document.documentElement;
    el.dataset.theme = el.dataset.theme === "dark" ? "" : "dark";
  });
</script>
</body>
</html>
