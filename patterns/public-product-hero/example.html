<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../tokens.css"><style>body{padding:32px;max-width:860px;margin:auto}.stack{display:grid;gap:12px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.panel{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);padding:16px}.grow{flex:1;min-width:0}</style></head><body><section class="stack" style="padding:52px 0;max-width:760px"><span class="status info">New release</span><h1 style="font-size:clamp(40px,8vw,78px);line-height:.95;margin:0">A clear product idea, shown directly.</h1><p style="max-width:620px;color:var(--text-muted);font-size:18px">Explain what the product does, show real evidence, then give one strong next action.</p><div class="row"><button class="btn primary btn-beam">Explore product</button><button class="btn btn-sweep">View evidence</button></div><div class="panel" style="min-height:180px;margin-top:24px">Real product visual or artifact belongs here.</div></section></body></html>
