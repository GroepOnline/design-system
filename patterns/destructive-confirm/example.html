<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../tokens.css"><style>body{padding:32px;max-width:860px;margin:auto}.stack{display:grid;gap:12px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.panel{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);padding:16px}.grow{flex:1;min-width:0}</style></head><body><button id="open" class="btn destructive">Delete item</button><dialog id="dlg" class="dialog"><form method="dialog" class="stack"><strong>Delete this item?</strong><div class="alert warning">This action cannot be undone.</div><div class="row" style="justify-content:flex-end"><button class="btn">Cancel</button><button class="btn destructive" value="confirm">Delete</button></div></form></dialog><script>const d=document.querySelector('#dlg');document.querySelector('#open').onclick=()=>d.showModal();</script></body></html>
