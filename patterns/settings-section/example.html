<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../tokens.css"><style>body{padding:32px;max-width:860px;margin:auto}.stack{display:grid;gap:12px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.panel{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);padding:16px}.grow{flex:1;min-width:0}</style></head><body><div class="panel stack" style="max-width:620px"><div class="field"><label class="field-label" for="density">Density</label><select id="density" class="select"><option>Compact</option><option>Comfortable</option></select></div><div class="row"><div class="grow"><strong>Live updates</strong><div class="field-help">Refresh important state automatically.</div></div><button id="sw" class="switch" role="switch" aria-checked="true" aria-label="Live updates"></button></div><div><button class="btn primary">Save changes</button></div></div><script>const s=document.querySelector('#sw');s.onclick=()=>s.setAttribute('aria-checked',s.getAttribute('aria-checked')!=='true');</script></body></html>
