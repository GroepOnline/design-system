<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../tokens.css"><style>body{padding:32px;max-width:860px;margin:auto}.stack{display:grid;gap:12px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.panel{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);padding:16px}.grow{flex:1;min-width:0}</style></head><body><div class="stack"><div class="sg-motion-beam"><input id="q" class="input" type="search" aria-label="Search results" placeholder="Search results…"></div><div class="row"><span class="status success dot">Ready</span><span class="status">12 results</span></div><div id="results" class="panel stack"><div>Architecture notes</div><div>Runtime contracts</div><div>Interaction examples</div></div><nav class="pagination"><button class="btn sm">Previous</button><span>1 / 4</span><button class="btn sm">Next</button></nav></div><script>const q=document.querySelector('#q'),r=document.querySelector('#results');q.oninput=()=>{const t=q.value.toLowerCase();[...r.children].forEach(x=>x.hidden=t&&!x.textContent.toLowerCase().includes(t))};</script></body></html>
