<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../tokens.css"><style>body{padding:32px;max-width:860px;margin:auto}.stack{display:grid;gap:12px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.panel{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);padding:16px}.grow{flex:1;min-width:0}</style></head><body><div class="panel stack" style="max-width:620px"><div class="input-group"><span class="input-affix">⌘</span><input id="cmd" class="input" aria-label="Command" placeholder="Type a command"><span class="input-affix">Enter</span></div><div id="menu" class="menu"><button class="menu-item" data-v="Open recent">Open recent</button><button class="menu-item" data-v="Search workspace">Search workspace</button><button class="menu-item" data-v="Run action">Run action</button></div></div><script>const q=document.querySelector('#cmd');document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{q.value=b.dataset.v;q.focus()});</script></body></html>
