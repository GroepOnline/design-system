<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../tokens.css"><style>body{padding:32px;max-width:860px;margin:auto}.stack{display:grid;gap:12px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.panel{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);padding:16px}.grow{flex:1;min-width:0}</style></head><body><div class="row"><button id="open" class="btn">Open details</button></div><dialog id="sheet" class="sheet right"><div class="stack"><div class="row"><strong class="grow">Details</strong><button id="close" class="gbtn" aria-label="Close">×</button></div><nav class="breadcrumb"><span>Home</span><span>Item</span></nav><div class="tabs" role="tablist"><button role="tab" aria-selected="true">Overview</button><button role="tab">Activity</button></div></div></dialog><script>const d=document.querySelector('#sheet');document.querySelector('#open').onclick=()=>d.showModal();document.querySelector('#close').onclick=()=>d.close();</script></body></html>
