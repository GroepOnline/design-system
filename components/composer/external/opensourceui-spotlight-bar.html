<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Opensource UI - Spotlight reference</title><link rel="stylesheet" href="../../../tokens.css"><style>
body{padding:38px 30px;background:#ededed;color:#171717;font-family:var(--font)} .ref{font:11px var(--mono);color:#737373;margin-bottom:18px} .wrap{width:min(390px,100%);position:relative}
.bar{display:flex;align-items:center;gap:10px;border:1px solid #fff;background:#ffffffa6;backdrop-filter:blur(12px);padding:12px;border-radius:16px;box-shadow:0 14px 34px #00000018}
input{min-width:0;flex:1;border:0;background:transparent;outline:0;font:14px var(--font)} kbd{font:10px var(--mono);border:1px solid #e5e5e5;background:#fafafa;border-radius:6px;padding:3px 6px;color:#737373}
.menu{position:absolute;top:58px;left:0;right:0;background:#fffffff2;backdrop-filter:blur(12px);border:1px solid #fff;border-radius:16px;padding:8px;box-shadow:0 14px 34px #0002}
.item{display:flex;width:100%;justify-content:space-between;border:0;background:transparent;padding:10px;border-radius:8px;text-align:left;font:13px var(--font);cursor:pointer} .item.active,.item:hover{background:#f5f5f5}
</style></head><body><div class="ref">external / Opensource UI / spotlight-bar.tsx / MIT / pinned d239c3463c</div><div class="wrap">
<form class="bar" id="form"><span aria-hidden>⌕</span><input id="q" aria-label="Spotlight search" placeholder="Search actions, pages, people…" autocomplete="off"><kbd>⌘K</kbd></form><div class="menu" id="menu" role="listbox"></div></div>
<script>
const all=[['new-page','Create page','P'],['invite','Invite teammate','I'],['analytics','Open analytics','A']];const q=document.querySelector('#q'),m=document.querySelector('#menu'),f=document.querySelector('#form');let active=0,view=[];
function draw(){view=all.filter(x=>x[1].toLowerCase().includes(q.value.trim().toLowerCase()));active=Math.min(active,Math.max(0,view.length-1));m.innerHTML=view.map((x,i)=>`<button type="button" class="item ${i===active?'active':''}" data-i="${i}" role="option" aria-selected="${i===active}"><span>✦ &nbsp;${x[1]}</span><kbd>${x[2]}</kbd></button>`).join('');m.hidden=!view.length}
q.oninput=()=>{active=0;draw()};q.onkeydown=e=>{if(e.key==='ArrowDown'){e.preventDefault();active=(active+1)%view.length;draw()}if(e.key==='ArrowUp'){e.preventDefault();active=(active-1+view.length)%view.length;draw()}if(e.key==='Escape')m.hidden=true};m.onclick=e=>{const b=e.target.closest('button');if(!b)return;q.value=view[+b.dataset.i][1];m.hidden=true};f.onsubmit=e=>{e.preventDefault();if(view[active])q.value=view[active][1];m.hidden=true};draw();
</script></body></html>
