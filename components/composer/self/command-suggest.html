<!DOCTYPE html>
<html lang="nl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>composer: command suggest</title><link rel="stylesheet" href="../../../tokens.css"><style>
body{padding:40px 32px;max-width:760px}.head{font:11px var(--mono);color:var(--text-faint);margin-bottom:20px}.shell{max-width:620px}.composer{background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-lg);padding:10px;transition:border-color var(--dur-fast),box-shadow var(--dur-fast)}.composer:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}.row{display:flex;align-items:center;gap:8px}.row svg{color:var(--text-faint)}input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--text);font:14px var(--font)}input::placeholder{color:var(--text-faint)}.kbd{font:10px var(--mono);color:var(--text-faint);border:1px solid var(--line);border-radius:4px;padding:2px 5px}.suggest{margin-top:7px;border-top:1px solid var(--line);padding-top:6px}.item{width:100%;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;border:0;background:transparent;color:var(--text-muted);padding:8px 7px;border-radius:var(--r-md);text-align:left;font:12.5px var(--font);cursor:pointer}.item:hover,.item.active{background:var(--hover);color:var(--text)}.meta{font:10px var(--mono);color:var(--text-faint)}.empty{padding:8px;font-size:12px;color:var(--text-faint)}</style></head><body>
<div class="head">self-modified / command-suggest / derived from Opensource UI spotlight</div><div class="shell"><div class="composer"><div class="row"><svg class="ic"><use href="../../../components/icons.svg#i-search"/></svg><input id="q" aria-label="Zoek actie of typ opdracht" placeholder="Zoek actie of typ opdracht"><span class="kbd">⌘K</span></div><div class="suggest" id="menu" role="listbox"></div></div></div>
<script>const data=[['fleet','Open fleet status','fleet','F'],['agents','Toon actieve agents','agents','A'],['deploy','Deploy ChefApp main','deploy','D'],['vault','Open Vault bewijs','vault','V']];const q=document.querySelector('#q'),m=document.querySelector('#menu');let active=0,view=[];function draw(){const s=q.value.trim().toLowerCase();view=data.filter(x=>x[1].toLowerCase().includes(s)||x[2].includes(s));if(!view.length){m.innerHTML='<div class="empty">Geen vaste actie. Enter stuurt de tekst als opdracht.</div>';return}active=Math.min(active,view.length-1);m.innerHTML=view.map((x,i)=>`<button class="item ${i===active?'active':''}" data-i="${i}" role="option" aria-selected="${i===active}"><span>${x[1]}</span><span class="meta">${x[2]} · ${x[3]}</span></button>`).join('')}q.oninput=()=>{active=0;draw()};q.onkeydown=e=>{if(e.key==='ArrowDown'&&view.length){e.preventDefault();active=(active+1)%view.length;draw()}if(e.key==='ArrowUp'&&view.length){e.preventDefault();active=(active-1+view.length)%view.length;draw()}if(e.key==='Escape'){q.value='';active=0;draw()}if(e.key==='Enter'&&view[active]){e.preventDefault();q.value=view[active][1];draw()}};m.onclick=e=>{const b=e.target.closest('button');if(!b)return;q.value=view[+b.dataset.i][1];draw()};draw();</script>
<!-- DERIVED: opensourceui-spotlight-bar; kept keyboard suggestion model; removed glass, blur, shadow shell. -->
</body></html>
