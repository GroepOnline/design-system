<!DOCTYPE html><html lang="nl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spring physics</title><link rel="stylesheet" href="../../../tokens.css"><style>*{box-sizing:border-box}body{margin:0;padding:28px}.lab{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:18px;max-width:980px;margin:auto}.stage{height:420px;position:relative;overflow:hidden;border:1px solid var(--line);border-radius:18px;background:var(--surface);background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:32px 32px;touch-action:none}.target{position:absolute;width:12px;height:12px;border:1px solid var(--line-strong);border-radius:50%;opacity:.45;transform:translate(-50%,-50%)}.orb{position:absolute;width:76px;height:76px;border-radius:22px;background:var(--text);color:var(--bg);display:grid;place-items:center;font:11px var(--mono);box-shadow:0 1px 2px rgba(0,0,0,.12),0 8px 24px rgba(0,0,0,.08);transform:translate(-50%,-50%);user-select:none}.trail{position:absolute;inset:0;pointer-events:none}.controls{border:1px solid var(--line);border-radius:16px;background:var(--surface);padding:15px}.ctl{display:grid;gap:5px;margin-bottom:14px}.ctl label{font-size:11px;color:var(--text-muted);display:flex;justify-content:space-between}.ctl output{font-family:var(--mono);color:var(--text)}input{width:100%;accent-color:var(--text-muted)}.hint{font-size:12px;color:var(--text-muted);line-height:1.5;margin-top:12px}@media(max-width:720px){.lab{grid-template-columns:1fr}}</style></head><body><main class="lab"><section class="stage" id="stage"><div class="target" id="target"></div><div class="orb" id="orb">drag / move</div></section><aside class="controls"><div class="caps" style="margin-bottom:14px">physics</div><div class="ctl"><label>Stiffness <output id="kO">180</output></label><input id="k" type="range" min="20" max="420" value="180"></div><div class="ctl"><label>Damping <output id="dO">18</output></label><input id="d" type="range" min="2" max="48" value="18"></div><div class="ctl"><label>Mass <output id="mO">1.0</output></label><input id="m" type="range" min=".3" max="3" step=".1" value="1"></div><div class="ctl"><label>Scale <output id="scaleO">1.00</output></label><input id="scale" type="range" min=".6" max="1.8" step=".05" value="1"></div><p class="hint">Beweeg of sleep in het vlak. Dit is een echte damped spring, niet alleen een CSS easing preset.</p></aside></main><script>
const st=document.querySelector('#stage'),o=document.querySelector('#orb'),t=document.querySelector('#target');let x=st.clientWidth/2,y=st.clientHeight/2,vx=0,vy=0,tx=x,ty=y,last=performance.now();const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;function setTarget(e){const r=st.getBoundingClientRect();tx=Math.max(38,Math.min(r.width-38,e.clientX-r.left));ty=Math.max(38,Math.min(r.height-38,e.clientY-r.top));t.style.left=tx+'px';t.style.top=ty+'px'}st.addEventListener('pointerdown',e=>{st.setPointerCapture(e.pointerId);setTarget(e)});st.addEventListener('pointermove',e=>setTarget(e));function frame(now){const dt=Math.min(.032,(now-last)/1000);last=now;if(reduce){x=tx;y=ty;vx=vy=0;o.style.left=x+'px';o.style.top=y+'px';requestAnimationFrame(frame);return}const K=+k.value,D=+d.value,M=+m.value;const ax=(K*(tx-x)-D*vx)/M,ay=(K*(ty-y)-D*vy)/M;vx+=ax*dt;vy+=ay*dt;x+=vx*dt;y+=vy*dt;o.style.left=x+'px';o.style.top=y+'px';o.style.transform=`translate(-50%,-50%) scale(${scale.value})`;requestAnimationFrame(frame)}[['k','kO',0],['d','dO',0],['m','mO',1],['scale','scaleO',2]].forEach(([i,out,dec])=>document.querySelector('#'+i).oninput=e=>document.querySelector('#'+out).textContent=(+e.target.value).toFixed(dec));t.style.left=tx+'px';t.style.top=ty+'px';requestAnimationFrame(frame);
</script></body></html>
