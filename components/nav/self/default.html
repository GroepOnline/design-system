<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>component: nav + sidebar</title>
<link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../tokens.css">
<style>
  body { padding: 40px 32px; }
  .demo-head { font-family: var(--mono); font-size: 11px; color: var(--text-faint); margin-bottom: 24px; }
  .demo-head a { color: var(--accent-ink); text-decoration: none; }
  .group { margin-bottom: 34px; max-width: 260px; }
  .group > .lbl { font-size: 12px; color: var(--text-faint); margin-bottom: 10px; }

  /* ==== COMPONENT CSS ==== */
  .ws-switcher {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 8px; border-radius: var(--r-md);
    font-weight: 500; font-size: 14px; cursor: pointer;
  }
  .ws-switcher:hover { background: var(--hover); }
  .ws-logo {
    width: 20px; height: 20px; border-radius: 6px;
    background: var(--text); color: var(--bg);
    display: grid; place-items: center; font-size: 11px; font-weight: 600;
  }
  .ws-switcher .ic { margin-left: auto; opacity: 0.5; }
  .nav { display: flex; flex-direction: column; gap: 1px; }
  .nav-item {
    display: flex; align-items: center; gap: 9px;
    padding: 0 10px 0 6px; height: 28px;
    border-radius: var(--r-md);
    font-size: 13px; font-weight: 500;
    color: var(--text-muted);
    cursor: pointer; user-select: none;
  }
  .nav-item:hover { background: var(--hover); }
  .nav-item.active { background: var(--surface-sunk); color: var(--text); font-weight: 500; }
  .nav-item .count { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--text-faint); }
  .recent-label {
    margin: 16px 8px 5px; font-size: 11.5px; font-weight: 500;
    color: var(--text-faint);
    display: flex; align-items: center; justify-content: space-between;
  }
  .recent-label .icons { display: flex; gap: 2px; }
  .recent-label .gbtn { width: 22px; height: 22px; }
  .session-item { padding: 6px 8px; border-radius: var(--r-md); cursor: pointer; }
  .session-item:hover { background: var(--hover); }
  .session-item.active { background: var(--surface-sunk); }
  .session-item .t { font-size: 13px; font-weight: 500; line-height: 1.3; display: flex; align-items: center; gap: 7px; }
  .session-item .m { font-size: 11.5px; color: var(--text-faint); margin-top: 2px; display: flex; gap: 5px; align-items: center; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex-shrink: 0; animation: dotpulse 2s ease-in-out infinite; }
  @keyframes dotpulse { 50% { opacity: 0.3; } }
  .pr-mini { font-family: var(--mono); font-size: 10.5px; color: var(--open-green); display: inline-flex; align-items: center; gap: 3px; }
  .pr-mini .ic { width: 11px; height: 11px; }
  /* ==== /COMPONENT CSS ==== */
</style>
</head>
<body>
<div class="demo-head"><a href="index.html">← components</a> / nav + sidebar</div>

<div class="group">
  <div class="lbl">workspace-switcher</div>
  <div class="ws-switcher">
    <div class="ws-logo">O</div>
    OpenWork
    <svg class="ic sm"><use href="../../../components/icons.svg#i-chevrons-updown"/></svg>
  </div>
</div>

<div class="group">
  <div class="lbl">hoofdnavigatie</div>
  <nav class="nav">
    <div class="nav-item active"><svg class="ic"><use href="../../../components/icons.svg#i-inbox"/></svg>Sessies <span class="count">3</span></div>
    <div class="nav-item"><svg class="ic"><use href="../../../components/icons.svg#i-message"/></svg>Ask</div>
    <div class="nav-item"><svg class="ic"><use href="../../../components/icons.svg#i-book"/></svg>Wiki</div>
    <div class="nav-item"><svg class="ic"><use href="../../../components/icons.svg#i-search"/></svg>Review <span class="count">2</span></div>
  </nav>
</div>

<div class="group">
  <div class="lbl">recent-lijst (met live-dot + PR-status)</div>
  <div class="recent-label">Recent
    <div class="icons">
      <button class="gbtn"><svg class="ic sm"><use href="../../../components/icons.svg#i-search"/></svg></button>
      <button class="gbtn"><svg class="ic sm"><use href="../../../components/icons.svg#i-plus"/></svg></button>
      <button class="gbtn"><svg class="ic sm"><use href="../../../components/icons.svg#i-more"/></svg></button>
    </div>
  </div>
  <div class="session-item active">
    <div class="t">Gradient-tekst migreren <span class="dot"></span></div>
    <div class="m">1 uur geleden · <span class="pr-mini"><svg class="ic"><use href="../../../components/icons.svg#i-git-pr"/></svg>2 open</span></div>
  </div>
  <div class="session-item">
    <div class="t">GitHub troubleshooting docs</div>
    <div class="m">2 uur geleden · <span class="pr-mini"><svg class="ic"><use href="../../../components/icons.svg#i-git-pr"/></svg>1 merged</span></div>
  </div>
</div>

<!-- CONTRACT
  active = surface-sunk + weight 500. counts in mono 11 faint.
  live-dot pulseert zacht (2s), geen harde animatie.
  pr-mini altijd groen + git-icoon.
-->
</body>
</html>
