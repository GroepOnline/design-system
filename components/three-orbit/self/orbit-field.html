<!DOCTYPE html><html lang="nl" data-theme="dark"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Three orbit</title><link rel="stylesheet" href="../../../tokens.css"><style>*{box-sizing:border-box}body{margin:0;padding:28px}.lab{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:18px;max-width:980px;margin:auto}.stage{height:430px;position:relative;overflow:hidden;border:1px solid var(--line);border-radius:18px;background:#08090d}.stage canvas{width:100%;height:100%;display:block}.label{position:absolute;left:14px;top:12px;color:#d7d9e0;font:10px var(--mono);z-index:2}.controls{border:1px solid var(--line);border-radius:16px;background:var(--surface);padding:15px}.ctl{display:grid;gap:5px;margin-bottom:14px}.ctl label{font-size:11px;color:var(--text-muted);display:flex;justify-content:space-between}.ctl output{font-family:var(--mono);color:var(--text)}input{width:100%;accent-color:var(--accent)}.fallback{position:absolute;inset:0;display:none;place-items:center;color:#9ca3af;font:12px var(--mono);padding:30px;text-align:center}@media(max-width:720px){.lab{grid-template-columns:1fr}}</style></head><body><main class="lab"><section class="stage" id="stage"><div class="label">THREE.JS / ORBIT FIELD</div><div class="fallback" id="fallback">Three.js kon niet geladen worden. Het specimen bewaart de engine dependency expliciet.</div></section><aside class="controls"><div class="caps" style="margin-bottom:14px">scene controls</div><div class="ctl"><label>Speed <output id="speedO">0.35</output></label><input id="speed" type="range" min="0" max="1.5" step=".05" value=".35"></div><div class="ctl"><label>Spread <output id="spreadO">3.2</output></label><input id="spread" type="range" min="1.5" max="6" step=".1" value="3.2"></div><div class="ctl"><label>Point size <output id="sizeO">0.035</output></label><input id="size" type="range" min=".01" max=".09" step=".005" value=".035"></div><p style="font-size:12px;color:var(--text-muted);line-height:1.5">Eerste 3D specimen. Later shaders, data worlds, product scenes en R3F varianten in dezelfde sectie.</p></aside></main><script type="module">
try{const THREE=await import('https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js');const st=document.querySelector('#stage'),scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(50,1,.1,100);cam.position.z=7;const ren=new THREE.WebGLRenderer({antialias:true,alpha:true});ren.setPixelRatio(Math.min(devicePixelRatio,2));st.appendChild(ren.domElement);const group=new THREE.Group();scene.add(group);const geo=new THREE.SphereGeometry(1,10,10);const mat=new THREE.MeshBasicMaterial({color:0x79a8ff,wireframe:true,transparent:true,opacity:.16});group.add(new THREE.Mesh(new THREE.IcosahedronGeometry(1.65,2),mat));const pgeo=new THREE.BufferGeometry(),arr=[];for(let i=0;i<420;i++){const r=1.8+Math.random()*2.4,a=Math.random()*Math.PI*2,b=Math.acos(2*Math.random()-1);arr.push(r*Math.sin(b)*Math.cos(a),r*Math.cos(b),r*Math.sin(b)*Math.sin(a))}pgeo.setAttribute('position',new THREE.Float32BufferAttribute(arr,3));const pmat=new THREE.PointsMaterial({color:0x8ab4ff,size:+size.value,transparent:true,opacity:.82});group.add(new THREE.Points(pgeo,pmat));function resize(){const w=st.clientWidth,h=st.clientHeight;ren.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}new ResizeObserver(resize).observe(st);let last=performance.now();const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;function frame(n){const dt=(n-last)/1000;last=n;if(!reduce){group.rotation.y+=dt*(+speed.value);group.rotation.x+=dt*(+speed.value)*.17;}group.scale.setScalar(+spread.value/3.2);pmat.size=+size.value;ren.render(scene,cam);requestAnimationFrame(frame)}[['speed','speedO',2],['spread','spreadO',1],['size','sizeO',3]].forEach(([i,o,d])=>document.querySelector('#'+i).oninput=e=>document.querySelector('#'+o).textContent=(+e.target.value).toFixed(d));resize();requestAnimationFrame(frame)}catch(e){fallback.style.display='grid';console.error(e)}
</script></body></html>
