<!DOCTYPE html><html lang="nl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../../tokens.css"><style>body{padding:34px 30px}.demo{max-width:520px}.stack{display:grid;gap:12px}.row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}</style></head><body><div class="demo"><div class="setting" style="max-width:420px"><div><div class="field-label">Meldingen</div><div class="field-help">Ontvang updates bij belangrijke veranderingen.</div></div><button class="switch" role="switch" aria-checked="true" aria-label="Meldingen"></button></div></div><script>document.querySelectorAll('.switch:not([aria-disabled="true"])').forEach(function(el){el.addEventListener("click",function(){el.setAttribute("aria-checked",el.getAttribute("aria-checked")!=="true"?"true":"false")})})</script></body></html>
