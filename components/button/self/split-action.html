<!DOCTYPE html><html lang="nl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../../tokens.css"><style>body{padding:38px 32px;min-height:130px;display:flex;align-items:center;justify-content:center;gap:12px}.note{font:11px var(--mono);color:var(--text-faint)}</style></head><body>
<div class="btn-split" id="split">
  <button class="btn primary">Publiceer</button>
  <button class="btn primary" id="more" aria-haspopup="menu" aria-expanded="false" aria-label="Meer publicatie-opties">⌄</button>
  <div class="btn-split-menu" id="menu" role="menu" hidden><button role="menuitem">Plan publicatie</button><button role="menuitem">Publiceer concept</button></div>
</div>
<script>const m=document.querySelector("#more"),menu=document.querySelector("#menu");m.addEventListener("click",()=>{const open=menu.hidden;menu.hidden=!open;m.setAttribute("aria-expanded",String(open))});</script>
</body></html>
