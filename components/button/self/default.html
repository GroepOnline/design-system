<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>component: button</title>
<link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../tokens.css">
<style>
  body { padding: 40px 32px; }
  .demo-head { font-family: var(--mono); font-size: 11px; color: var(--text-faint); margin-bottom: 24px; }
  .demo-head a { color: var(--accent-ink); text-decoration: none; }
  .group { margin-bottom: 28px; }
  .group .lbl { font-size: 12px; color: var(--text-faint); margin-bottom: 10px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
</style>
</head>
<body>
<div class="demo-head"><a href="index.html">← components</a> / button</div>

<div class="group">
  <div class="lbl">variants</div>
  <div class="row">
    <button class="btn">Standaard</button>
    <button class="btn primary">Primaire actie</button>
    <button class="btn subtle">Subtiel</button>
    <button class="btn ghost">Ghost</button>
    <button class="btn destructive">Verwijderen</button>
    <button class="btn" disabled>Uitgeschakeld</button>
  </div>
</div>

<div class="group">
  <div class="lbl">groottes</div>
  <div class="row">
    <button class="btn sm">Klein (h28)</button>
    <button class="btn">Standaard (h32)</button>
    <button class="btn lg">Groot (h38)</button>
    <button class="btn primary lg">Groot primair</button>
  </div>
</div>

<div class="group">
  <div class="lbl">laden</div>
  <div class="row">
    <button class="btn loading" aria-busy="true">Opslaan</button>
    <button class="btn primary loading" aria-busy="true">Verwerken</button>
    <button class="btn sm loading" aria-busy="true">Even geduld</button>
  </div>
</div>

<div class="group">
  <div class="lbl">knopgroep</div>
  <div class="row">
    <div class="btn-group">
      <button class="btn">Links</button>
      <button class="btn">Midden</button>
      <button class="btn">Rechts</button>
    </div>
  </div>
  <div class="row" style="margin-top:10px">
    <div class="btn-group">
      <button class="btn primary">Actief</button>
      <button class="btn">Inactief</button>
    </div>
  </div>
</div>

<div class="group">
  <div class="lbl">met toetsenbord-hint (approval-patroon)</div>
  <div class="row">
    <button class="btn primary">Een keer <kbd>1</kbd></button>
    <button class="btn">Altijd in deze map <kbd>2</kbd></button>
    <button class="btn">Weigeren <kbd>3</kbd></button>
  </div>
</div>

<div class="group">
  <div class="lbl">icoon-knoppen (.gbtn)</div>
  <div class="row">
    <button class="gbtn" aria-label="Toevoegen"><svg class="ic"><use href="../../../components/icons.svg#i-plus"/></svg></button>
    <button class="gbtn" aria-label="Microfoon"><svg class="ic"><use href="../../../components/icons.svg#i-mic"/></svg></button>
    <button class="gbtn outline" aria-label="Zoeken"><svg class="ic"><use href="../../../components/icons.svg#i-search"/></svg></button>
    <button class="gbtn solid" aria-label="Versturen"><svg class="ic"><use href="../../../components/icons.svg#i-arrow-up"/></svg></button>
  </div>
</div>

<div class="group">
  <div class="lbl">met icoon</div>
  <div class="row">
    <button class="btn"><svg class="ic sm"><use href="../../../components/icons.svg#i-play"/></svg>Run</button>
    <button class="btn"><svg class="ic sm"><use href="../../../components/icons.svg#i-download"/></svg>Download</button>
    <button class="btn"><svg class="ic sm"><use href="../../../components/icons.svg#i-external"/></svg>Open in GitHub</button>
  </div>
</div>

<!-- CONTRACT
  .btn             h32 / optical px12 / r-md / hairline; coarse pointer min-h44
  .btn.primary     inverse high emphasis; max one primary per local decision context
  .btn.subtle      quiet filled action; .btn.ghost = containerless lower emphasis
  .btn.destructive semantic red only for destructive actions
  .btn.sm/.lg      h28/h38; same interaction physics
  .btn.loading     static activity mark + aria-busy; never infinite spinner
  .gbtn            30px visual; coarse pointer 44px; accessible name required
  .gbtn.solid      high-emphasis icon action; .gbtn.outline = persistent boundary
  :active          1px press + subtle scale; :focus-visible 2px accent outline
  kbd              compact mono key hint with quiet inset surface
-->
</body>
</html>
