<!DOCTYPE html><html lang="nl"><head><meta charset="UTF-8"><link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600&display=swap" rel="stylesheet"><link rel="stylesheet" href="../../../tokens.css"><style>
body{padding:34px 30px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
/* shadcn/ui default button (geobserveerd) */
.sh-btn{height:36px;padding:0 16px;border-radius:6px;border:none;font-family:var(--font);font-size:14px;font-weight:500;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.sh-default{background:#18181B;color:#FAFAFA}.sh-default:hover{background:#27272A}
.sh-secondary{background:#F4F4F5;color:#18181B}.sh-secondary:hover{background:#E4E4E7}
.sh-outline{background:#fff;border:1px solid #E4E4E7;color:#18181B}.sh-outline:hover{background:#F4F4F5}
.sh-destructive{background:#DC2626;color:#fff}.sh-destructive:hover{background:#B91C1C}
.sh-ghost{background:transparent;color:#18181B;box-shadow:none}.sh-ghost:hover{background:#F4F4F5}
</style></head><body>
<button class="sh-btn sh-default">Default</button>
<button class="sh-btn sh-secondary">Secondary</button>
<button class="sh-btn sh-outline">Outline</button>
<button class="sh-btn sh-destructive">Destructive</button>
<button class="sh-btn sh-ghost">Ghost</button>
</body></html>
