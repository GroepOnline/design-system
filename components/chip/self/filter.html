<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../../tokens.css"><style>body{padding:28px;max-width:720px;margin:auto}.demo-stack{display:grid;gap:12px}.demo-label{font-size:12px;font-weight:500}.demo-note{font-size:12px;color:var(--text-muted)}</style></head><body><div class="interaction-chips" aria-label="Filters"><button class="interaction-chip" aria-pressed="true">Design</button><button class="interaction-chip" aria-pressed="false">Code</button><button class="interaction-chip" aria-pressed="false">Docs</button></div><script>document.querySelectorAll('.interaction-chip').forEach(b=>b.onclick=()=>b.setAttribute('aria-pressed',String(b.getAttribute('aria-pressed')!=='true')))</script></body></html>
