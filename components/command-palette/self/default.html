<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../../tokens.css"><style>body{padding:28px;max-width:720px;margin:auto}.demo-stack{display:grid;gap:12px}.demo-label{font-size:12px;font-weight:500}.demo-note{font-size:12px;color:var(--text-muted)}</style></head><body><button class="btn" id="open">Open commands <kbd>⌘K</kbd></button><dialog class="interaction-command" id="cmd" aria-label="Command palette"><div class="interaction-command-search"><input class="input" id="cq" placeholder="Type a command" aria-label="Search commands"></div><div class="interaction-listbox" role="listbox" aria-label="Commands"><button role="option">Open project</button><button role="option">Search files</button><button role="option">Run checks</button><button role="option">Open settings</button></div><button class="btn ghost" id="close">Close</button></dialog><script>const d=document.querySelector('#cmd'),q=document.querySelector('#cq');document.querySelector('#open').onclick=()=>{d.showModal();setTimeout(()=>q.focus(),0)};document.querySelector('#close').onclick=()=>d.close();q.oninput=()=>{const v=q.value.toLowerCase();d.querySelectorAll('[role=option]').forEach(x=>x.hidden=!x.textContent.toLowerCase().includes(v))};</script></body></html>
