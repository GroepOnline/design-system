<!DOCTYPE html>
<html lang="nl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>approval: guarded drag</title><link rel="stylesheet" href="../../../tokens.css"><style>
body{padding:40px 32px;max-width:760px}.head{font:11px var(--mono);color:var(--text-faint);margin-bottom:20px}.approval{border:1px solid var(--hold-line);border-radius:var(--r-lg);background:var(--surface);padding:13px 15px}.kind{display:flex;gap:7px;align-items:center;color:var(--amber);font-size:12px;font-weight:500}.cmd{font:12px/1.5 var(--mono);background:var(--surface-sunk);border-radius:var(--r-md);padding:8px 10px;margin:9px 0 11px;overflow:auto}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.guard{position:relative;width:260px;height:34px;border:1px solid var(--line-strong);border-radius:var(--r-md);background:var(--bg);overflow:hidden;touch-action:none}.fill{position:absolute;inset:0 auto 0 0;width:0;background:var(--accent-soft)}.guard-label{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;color:var(--text-muted);pointer-events:none}.handle{position:absolute;left:3px;top:3px;width:42px;height:26px;border:1px solid var(--hold-line);border-radius:5px;background:var(--surface);color:var(--amber);font:600 14px var(--font);cursor:grab}.handle:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.guard.done{border-color:var(--accent)}.guard.done .guard-label{color:var(--accent-ink);font-weight:500}.deny{height:34px}.hint{font:10px var(--mono);color:var(--text-faint);margin-top:8px}</style></head><body>
<div class="head">self-modified / guarded-drag / derived from Opensource UI slide confirm</div><div class="approval"><div class="kind"><svg class="ic"><use href="../../../components/icons.svg#i-alert"/></svg>Wacht op jou: deploy main naar productie</div><div class="cmd">chef deploy chefapp --ref main --env production</div><div class="actions"><div class="guard" id="guard"><div class="fill" id="fill"></div><span class="guard-label" id="label">Sleep om een keer toe te staan</span><button class="handle" id="handle" aria-label="Sleep om een keer toe te staan">→</button></div><button class="btn deny" id="deny">Weigeren <kbd>3</kbd></button></div><div class="hint">Enter op de sleepknop bevestigt ook. Geen auto-repeat, geen success-groen.</div></div>
<script>const g=document.querySelector('#guard'),h=document.querySelector('#handle'),f=document.querySelector('#fill'),l=document.querySelector('#label');let drag=false,x=0,done=false;const max=()=>g.clientWidth-h.offsetWidth-6;function draw(n,anim=false){x=Math.max(0,Math.min(n,max()));h.style.transition=anim?'transform 160ms var(--ease-out)':'none';h.style.transform=`translateX(${x}px)`;f.style.width=`${x+h.offsetWidth+3}px`}function confirm(){done=true;draw(max(),true);g.classList.add('done');l.textContent='Een keer toegestaan';h.textContent='✓';h.disabled=true}h.onpointerdown=e=>{if(done)return;drag=true;h.setPointerCapture(e.pointerId)};h.onpointermove=e=>{if(!drag||done)return;const r=g.getBoundingClientRect();draw(e.clientX-r.left-h.offsetWidth/2)};h.onpointerup=h.onpointercancel=()=>{if(!drag)return;drag=false;x>=max()-5?confirm():draw(0,true)};h.onkeydown=e=>{if((e.key==='Enter'||e.key===' ')&&!done){e.preventDefault();confirm()}};document.querySelector('#deny').onclick=()=>{if(done)return;l.textContent='Geweigerd';g.style.opacity='.55'};</script>
<!-- DERIVED: opensourceui-slide-confirm; kept drag semantics; removed pill/material/success-green treatment. -->
</body></html>
