<!DOCTYPE html><html lang="nl" data-theme="dark"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Border beam lab</title><link rel="stylesheet" href="../../../tokens.css"><style>
*{box-sizing:border-box}body{margin:0;padding:28px}.lab{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:18px;max-width:980px;margin:auto}.stage{min-height:360px;display:grid;place-items:center;border:1px solid var(--line);border-radius:18px;background:var(--surface)}.beam{--c1:#38bdf8;--c2:#2563eb;--c3:#8b5cf6;--c4:#22d3ee;--s:.72;--bloom:.30;--speed:2.8s;position:relative;border-radius:18px;padding:1px;background:var(--surface)}.beam:before,.beam:after{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;background:conic-gradient(from var(--a),transparent 0 66%,var(--c1) 74%,var(--c2) 82%,var(--c3) 90%,var(--c4) 95%,transparent 100%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;opacity:var(--s);animation:spin var(--speed) linear infinite}.beam:after{inset:-3px;filter:blur(9px);opacity:var(--bloom)}@property --a{syntax:"<angle>";inherits:false;initial-value:0deg}@keyframes spin{to{--a:360deg}}@media(prefers-reduced-motion:reduce){.beam:before,.beam:after{animation:none}}.card{width:min(520px,70vw);padding:26px;border:1px solid var(--line);border-radius:17px;background:var(--surface);box-shadow:0 18px 60px rgba(0,0,0,.16)}.card h2{margin:14px 0 8px}.card p{margin:0;color:var(--text-muted)}.controls{border:1px solid var(--line);border-radius:16px;background:var(--surface);padding:15px}.ctl{display:grid;gap:5px;margin-bottom:13px}.ctl label{font-size:11px;color:var(--text-muted);display:flex;justify-content:space-between}.ctl output{font-family:var(--mono);color:var(--text)}select,input{width:100%}select{height:30px;background:var(--surface-sunk);color:var(--text);border:1px solid var(--line);border-radius:7px;padding:0 8px}input{accent-color:var(--accent)}@media(max-width:720px){.lab{grid-template-columns:1fr}}
</style></head><body><main class="lab"><section class="stage"><div class="beam" id="beam"><article class="card"><span class="badge accent dot">Live effect</span><h2>Border Beam</h2><p>Lokale, dependency-vrije effectprimitive. Gebruik hem als materiaal, niet als decoratie overal.</p></article></div></section><aside class="controls"><div class="caps" style="margin-bottom:14px">live controls</div><div class="ctl"><label>Palette</label><select id="palette" aria-label="Palette"><option value="ocean">Ocean</option><option value="colorful">Colorful</option><option value="sunset">Sunset</option><option value="mono">Mono</option></select></div><div class="ctl"><label>Strength <output id="strengthO">0.72</output></label><input id="strength" aria-label="Strength" type="range" min="0" max="1" step=".01" value=".72"></div><div class="ctl"><label>Speed <output id="speedO">2.8s</output></label><input id="speed" aria-label="Speed" type="range" min=".8" max="8" step=".1" value="2.8"></div><div class="ctl"><label>Radius <output id="radiusO">18px</output></label><input id="radius" aria-label="Radius" type="range" min="0" max="36" value="18"></div><div class="ctl"><label>Theme</label><select id="theme" aria-label="Theme"><option value="dark">Dark</option><option value="light">Light</option></select></div></aside></main><script>
const b=document.querySelector('#beam'),root=document.documentElement;const palettes={ocean:['#38bdf8','#2563eb','#8b5cf6','#22d3ee'],colorful:['#f472b6','#8b5cf6','#22d3ee','#facc15'],sunset:['#fb923c','#f43f5e','#facc15','#ef4444'],mono:['#fff','#a1a1aa','#e4e4e7','#71717a']};palette.onchange=()=>palettes[palette.value].forEach((x,i)=>b.style.setProperty('--c'+(i+1),x));strength.oninput=()=>{b.style.setProperty('--s',strength.value);b.style.setProperty('--bloom',(Number(strength.value)*.42).toFixed(3));strengthO.textContent=Number(strength.value).toFixed(2)};speed.oninput=()=>{b.style.setProperty('--speed',speed.value+'s');speedO.textContent=speed.value+'s'};radius.oninput=()=>{b.style.borderRadius=radius.value+'px';radiusO.textContent=radius.value+'px'};theme.onchange=()=>root.dataset.theme=theme.value==='dark'?'dark':'light';
</script></body></html>
