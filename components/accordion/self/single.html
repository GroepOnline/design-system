<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../../tokens.css"><style>body{padding:28px;max-width:720px;margin:auto}.demo-stack{display:grid;gap:12px}.demo-label{font-size:12px;font-weight:500}.demo-note{font-size:12px;color:var(--text-muted)}</style></head><body><div class="interaction-accordion" id="a"><details open><summary>General</summary><div class="interaction-panel">General settings.</div></details><details><summary>Advanced</summary><div class="interaction-panel">Advanced settings.</div></details></div><script>document.querySelectorAll('#a details').forEach(d=>d.addEventListener('toggle',()=>{if(d.open)document.querySelectorAll('#a details').forEach(x=>{if(x!==d)x.open=false})}))</script></body></html>
