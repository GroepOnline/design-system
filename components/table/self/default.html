<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>table — design-system</title>
<link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../tokens.css">
<style>
  body { padding: 32px 24px; max-width: 1000px; margin: 0 auto; }
  h1 { font-size: 22px; font-weight: 500; letter-spacing: -0.02em; margin-bottom: 4px; }
  .cat { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-faint); font-weight: 600; margin-bottom: 22px; }
  .note { font-size: 13px; color: var(--text-muted); margin-bottom: 24px; line-height: 1.5; }

  /* ---- table ---- */
  .tbl {
    border-collapse: collapse; width: 100%; font-size: 13px;
    border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden;
    background: var(--surface);
  }
  .tbl th {
    text-align: left; font-weight: 500; font-size: 11.5px; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--text-faint); padding: 9px 14px;
    border-bottom: 1px solid var(--line);
  }
  .tbl td { padding: 8px 14px; border-top: 1px solid var(--line); color: var(--text); }
  .tbl td.mono { font-family: var(--mono); font-size: 12px; font-variant-numeric: tabular-nums; }
  .tbl tr:hover td { background: var(--hover); }
  .tbl tbody tr:first-child td { border-top: none; }
  /* status badges */
  .tbl .badge { font-size: 11px; font-family: var(--mono); }
  .tbl .green { background: var(--open-green-bg); color: var(--open-green); }
  .tbl .amber { background: var(--hold-amber-bg); color: var(--hold-amber); }
  .tbl .red { background: var(--danger-bg); color: var(--red); }
  /* zebra — subtle */
  .tbl tbody tr:nth-child(even) td { background: var(--bg); }
  .tbl tbody tr:hover td { background: var(--hover); }
</style>
</head>
<body>

<h1>table</h1>
<div class="cat">bewijs</div>
<div class="note">Dashboard-tabellen met hairline dividers, hover states, en inline status badges. Monospace voor datakolommen.</div>

<table class="tbl">
  <thead>
    <tr>
      <th>Component</th>
      <th>Variants</th>
      <th>Eigen</th>
      <th>Status</th>
      <th>Gewijzigd</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td>button</td>
      <td>7</td>
      <td>5</td>
      <td><span class="badge green">ACTIEF</span></td>
      <td class="mono">2026-07-28</td>
    </tr>
    <tr>
      <td>settings</td>
      <td>2</td>
      <td>2</td>
      <td><span class="badge amber">LOCKED</span></td>
      <td class="mono">2026-07-30</td>
    </tr>
    <tr>
      <td>studio</td>
      <td>3</td>
      <td>3</td>
      <td><span class="badge green">ACTIEF</span></td>
      <td class="mono">2026-07-27</td>
    </tr>
    <tr>
      <td>pr-card</td>
      <td>1</td>
      <td>1</td>
      <td><span class="badge red">ERROR</span></td>
      <td class="mono">2026-07-29</td>
    </tr>
  </tbody>
</table>

</body>
</html>
