<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../../tokens.css"><style>body{padding:28px;max-width:720px;margin:auto}.demo-stack{display:grid;gap:12px}.demo-label{font-size:12px;font-weight:500}.demo-note{font-size:12px;color:var(--text-muted)}</style></head><body><label class="demo-label" for="cb">Framework</label><div class="interaction-combobox"><input id="cb" class="input" role="combobox" aria-autocomplete="list" aria-expanded="true" aria-controls="cb-list" placeholder="Search frameworks"><div id="cb-list" class="interaction-listbox" role="listbox" aria-label="Framework suggestions"><button role="option" aria-selected="false" data-value="React">React</button><button role="option" aria-selected="false" data-value="Vue">Vue</button><button role="option" aria-selected="false" data-value="Svelte">Svelte</button><button role="option" aria-selected="false" data-value="Solid">Solid</button><div class="interaction-empty" hidden>No matches</div></div></div><script>const i=document.querySelector('#cb'),l=document.querySelector('#cb-list'),opts=[...l.querySelectorAll('[role=option]')],empty=l.querySelector('.interaction-empty');function filter(){const q=i.value.toLowerCase();let n=0;opts.forEach(o=>{o.hidden=!o.dataset.value.toLowerCase().includes(q);if(!o.hidden)n++});empty.hidden=n!==0;i.setAttribute('aria-expanded','true')}i.addEventListener('input',filter);opts.forEach(o=>o.onclick=()=>{i.value=o.dataset.value;opts.forEach(x=>x.setAttribute('aria-selected',String(x===o)));l.hidden=true;i.setAttribute('aria-expanded','false');i.focus()});i.addEventListener('focus',()=>{l.hidden=false;i.setAttribute('aria-expanded','true')});</script></body></html>
