<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Opensource UI - Deploy notification reference</title><link rel="stylesheet" href="../../../tokens.css"><style>
body{padding:38px 30px;background:#f6f6f6;color:#171717;font-family:var(--font)} .ref{font:11px var(--mono);color:#737373;margin-bottom:18px} .note{position:relative;width:320px;display:grid;grid-template-columns:38px 1fr;gap:11px;background:#fffffff0;border:1px solid #ffffff;border-radius:20px;padding:13px 34px 13px 14px;box-shadow:0 8px 32px #00000018;backdrop-filter:blur(14px)}
.logo{width:38px;height:38px;border-radius:10px;background:#171717;color:white;display:grid;place-items:center;font-size:18px} .top{display:flex;justify-content:space-between;gap:10px;font-size:13px;font-weight:600} .time{font-size:11px;color:#a3a3a3;font-weight:400} .copy{font-size:13px;line-height:1.4;color:#525252;margin-top:3px} .x{position:absolute;right:8px;top:8px;border:0;background:transparent;color:#a3a3a3;cursor:pointer} .show{border:0;border-radius:12px;padding:8px 12px;background:#e5e5e5;cursor:pointer}
</style></head><body><div class="ref">external / Opensource UI / deploy-notification-banner.tsx / MIT / pinned d239c3463c</div>
<div id="host"><output class="note" id="note"><div class="logo">▲</div><div><div class="top"><span>Vercel</span><span class="time">42s</span></div><div class="copy"><strong>chefapp</strong> is live on production <span style="color:#a3a3a3">(main)</span></div></div><button class="x" id="dismiss" aria-label="Dismiss">×</button></output></div>
<script>const h=document.querySelector('#host');function render(){h.innerHTML='<output class="note" id="note"><div class="logo">▲</div><div><div class="top"><span>Vercel</span><span class="time">42s</span></div><div class="copy"><strong>chefapp</strong> is live on production <span style="color:#a3a3a3">(main)</span></div></div><button class="x" id="dismiss" aria-label="Dismiss">×</button></output>';h.querySelector('#dismiss').onclick=()=>{h.innerHTML='<button class="show" id="show">Show deploy alert</button>';h.querySelector('#show').onclick=render}}render();</script>
</body></html>
